name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name code_studio_mobile

      - name: Pin Gradle 8.14 and AGP 8.9.1
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          sed -i 's/com.android.application") version "[0-9.]*"/com.android.application") version "8.9.1"/' android/settings.gradle.kts
          echo "---- wrapper ----"
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "---- settings plugins ----"
          grep -n "application" android/settings.gradle.kts

      - name: Add Chaquopy (Python) to Android build
        run: |
          sed -i '/id("org.jetbrains.kotlin.android")/a\    id("com.chaquo.python") version "16.1.0" apply false' android/settings.gradle.kts
          sed -i 's/id("dev.flutter.flutter-gradle-plugin")/id("dev.flutter.flutter-gradle-plugin")\n    id("com.chaquo.python")/' android/app/build.gradle.kts
          sed -i 's/versionName = flutter.versionName/versionName = flutter.versionName\n        ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a", "x86_64") }/' android/app/build.gradle.kts
          cat >> android/app/build.gradle.kts << 'EOF'

          chaquopy {
              defaultConfig {
                  version = "3.11"
              }
          }
          EOF
          echo "---- app build.gradle.kts after patch ----"
          cat android/app/build.gradle.kts

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: code-studio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
