name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name code_studio_mobile

      - name: Download offline runtimes
        run: |
          mkdir -p assets/pyodide assets/three assets/cannon
          PY=https://cdn.jsdelivr.net/pyodide/v0.25.1/full
          for f in pyodide.js pyodide.asm.js pyodide.asm.wasm python_stdlib.zip pyodide-lock.json; do
            curl -fsSL "$PY/$f" -o "assets/pyodide/$f"
          done
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o assets/three/three.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js -o assets/cannon/cannon.min.js
          du -sh assets/pyodide assets/three assets/cannon

      - name: Generate app icon from uploaded design
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p assets
          convert app_icon.png -resize 512x512 assets/icon.png
          convert app_icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert app_icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert app_icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert app_icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert app_icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Allow internet permission
        run: |
          python3 - << 'PYEOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perm = '    <uses-permission android:name="android.permission.INTERNET"/>\n'
          if 'android.permission.INTERNET' not in s:
              i = s.index('>', s.index('<manifest')) + 1
              s = s[:i] + '\n' + perm + s[i:]
          open(p, 'w', encoding='utf-8').write(s)
          PYEOF
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml

      - name: Create upload keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          ls -l "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
          } > android/key.properties

      - name: Wire upload signing into Gradle
        run: |
          python3 - << 'PYEOF'
          p = 'android/app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          header = 'import java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n\n'
          s = header + s
          signing = 'signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n    '
          s = s.replace('    buildTypes {', '    ' + signing + 'buildTypes {', 1)
          s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          s += '\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}\n'
          open(p, 'w', encoding='utf-8').write(s)
          PYEOF
          grep -n "signingConfig" android/app/build.gradle.kts

      - run: flutter pub get

      - run: flutter build apk --release --android-skip-build-dependency-validation

      - uses: actions/upload-artifact@v4
        with:
          name: code-studio-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - run: flutter build appbundle --release --android-skip-build-dependency-validation

      - uses: actions/upload-artifact@v4
        with:
          name: code-studio-aab
          path: build/app/outputs/bundle/release/app-release.aab
