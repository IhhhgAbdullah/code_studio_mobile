name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name code_studio_mobile

      - name: Show Gradle files
        run: |
          ls android/app
          echo "----- root build -----"
          cat android/build.gradle* || true
          echo "----- app build -----"
          cat android/app/build.gradle* || true
          echo "----- settings -----"
          cat android/settings.gradle* || true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: code-studio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
