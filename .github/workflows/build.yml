name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name code_studio_mobile

      - name: Generate app icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p assets
          cat > assets/icon.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#16396B"/>
                <stop offset="1" stop-color="#061429"/>
              </linearGradient>
              <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#F7E08A"/>
                <stop offset="1" stop-color="#D4AF37"/>
              </linearGradient>
              <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
                <stop offset="0" stop-color="#D4AF37" stop-opacity="0.25"/>
                <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <rect width="512" height="512" rx="110" fill="url(#bg)"/>
            <circle cx="256" cy="256" r="210" fill="url(#glow)"/>
            <rect x="34" y="34" width="444" height="444" rx="92" fill="none" stroke="#D4AF37" stroke-opacity="0.6" stroke-width="6"/>
            <text x="256" y="310" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="210" fill="url(#gold)">CS</text>
            <rect x="166" y="352" width="180" height="10" rx="5" fill="#D4AF37"/>
          </svg>
          EOF
          convert -background none -density 384 assets/icon.svg -resize 512x512 assets/icon.png
          convert assets/icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert assets/icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert assets/icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert assets/icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert assets/icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Allow internet permission
        run: |
          python3 - << 'PYEOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perm = '    <uses-permission android:name="android.permission.INTERNET"/>\n'
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest', '<manifest', 1)
              i = s.index('>', s.index('<manifest')) + 1
              s = s[:i] + '\n' + perm + s[i:]
          open(p, 'w', encoding='utf-8').write(s)
          PYEOF
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml

      - name: Create upload keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          ls -l "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
          } > android/key.properties

      - name: Wire upload signing into Gradle
        run: |
          python3 - << 'PYEOF'
          p = 'android/app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          header = 'import java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n\n'
          s = header + s
          signing = 'signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n    '
          s = s.replace('    buildTypes {', '    ' + signing + 'buildTypes {', 1)
          s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          open(p, 'w', encoding='utf-8').write(s)
          PYEOF
          grep -n "signingConfig" android/app/build.gradle.kts

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: code-studio-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: code-studio-aab
          path: build/app/outputs/bundle/release/app-release.aab
